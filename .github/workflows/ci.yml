name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fitsync }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitsync
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      ADMIN_EMAILS: admin@test.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations and seed (test database)
        run: npx prisma migrate deploy && npm run db:seed
      - run: npm run build
      - name: API integration tests
        run: |
          npx next start -p 3100 &
          npx wait-on http-get://localhost:3100/api/health --timeout 60000
          TEST_SERVER_URL=http://localhost:3100 npm run test:integration

  migrate-production:
    # Runs only after checks pass on main. Needs repo secret PRODUCTION_DATABASE_URL.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: prisma migrate deploy
        env: { DATABASE_URL: "${{ secrets.PRODUCTION_DATABASE_URL }}" }
        run: npx prisma migrate deploy
