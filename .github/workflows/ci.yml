name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fitsync }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitsync
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      SEED_DEMO: "true"
      SHOW_DEMO_BRANDS: "true"
      # test-only settings for the integration run
      TRUST_PROXY: "true"
      EMAIL_PROVIDER: outbox
      ALLOW_TEST_EMAIL_OUTBOX: "true"
      EMAIL_OUTBOX_DIR: /tmp/fitsync-outbox
      CRON_SECRET: ci-cron-secret-ci-cron-secret
      ADMIN_BOOTSTRAP_PASSWORD: tailor-linen-meadow-42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run research:validate
      - run: npm test
      - name: Schema and migrations agree (drift report; make blocking once it passes on your repo)
        continue-on-error: true
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE fitsync_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/fitsync_shadow --exit-code
      - name: Apply migrations, seed, bootstrap the test administrator
        run: npx prisma migrate deploy && npm run db:seed && npm run admin:bootstrap -- --email admin@test.local
      - run: npm run build
      - name: API integration tests
        run: |
          npx next start -p 3100 &
          npx wait-on http-get://localhost:3100/api/health --timeout 60000
          TEST_SERVER_URL=http://localhost:3100 npx vitest run tests
      - name: Dependency audit (report)
        run: npm run audit:deps
        continue-on-error: true

  migrate-production:
    # Runs only after checks pass on main. Needs repo secret PRODUCTION_DATABASE_URL.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: prisma migrate deploy
        env: { DATABASE_URL: "${{ secrets.PRODUCTION_DATABASE_URL }}" }
        run: npx prisma migrate deploy
